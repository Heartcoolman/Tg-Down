name: CI/CD Pipeline
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

env:
  GO_VERSION: '1.25.12'
  GOPROXY: 'https://proxy.golang.org,direct'

jobs:
  # 快速车道：除 cmd 与 internal/telegram 外的包都不碰 CGo/TDLib，几十秒就能给出反馈，
  # 不必等下面那条要编 TDLib 的作业（缓存未命中时 30-60 分钟）。
  # 包清单用 go list 求补集：任何包一旦意外 import 了 internal/telegram，这条车道会直接编译失败——
  # 这正是要守住的 CGo 边界。
  unit:
    runs-on: ubuntu-latest
    name: Fast Unit Tests (no TDLib)
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run pure-Go tests
        run: |
          PKGS=$(go list ./... | grep -v -e '/cmd$' -e '/cmd/desktop$' -e '/internal/telegram$')
          echo "$PKGS"
          go test -race -cover $PKGS

  test:
    runs-on: ubuntu-latest
    name: Test and Build
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install desktop build deps
        # cmd/desktop（Wails）参与 vet/test 的全量编译：webkit2gtk-4.1 对应 webkit2_41 标签
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        run: cd web && npm ci --no-audit --no-fund && npm run build

      - name: Setup TDLib
        uses: ./.github/actions/setup-tdlib

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet -tags "desktop,production,webkit2_41" ./...

      - name: Run tests
        run: go test -race -cover -tags "webkit2_41" ./...

      - name: Build application
        run: |
          go build -v -o tg-down ./cmd
          ls -la tg-down

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: tg-down-linux
          path: tg-down

  # Windows 必须走 MSYS2 + MinGW-w64：CGo 只认 gcc 系工具链，MSVC 这条路不通。
  # go-tdlib 的 cgo 链接指令是 //go:build linux 独占的，所以这里和 macOS 一样，
  # 全部链接参数由 CGO_LDFLAGS（scripts/tdlib-libs.sh）提供。
  build-windows:
    runs-on: windows-latest
    name: Build (Windows)
    env:
      # 显式指定前缀，不用 ~：MSYS2 与 actions/cache（Node，Windows 路径语义）对 HOME 的
      # 理解不一致，写死一个 Windows 风格绝对路径可让两边指向同一处。
      TDLIB_PREFIX: C:/tdlib
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up MSYS2 (MinGW-w64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          # 继承 Windows PATH，msys2 shell 里才看得到 setup-go 装的 go
          path-type: inherit
          update: false
          install: git make
          # TDLib 命中缓存时不会跑 install-tdlib.sh，工具链得由这里保证存在
          pacboy: >-
            toolchain:p
            cmake:p
            gperf:p
            openssl:p
            zlib:p

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        shell: pwsh
        run: cd web; npm ci --no-audit --no-fund; npm run build

      - name: Cache TDLib
        id: tdlib-cache
        uses: actions/cache@v4
        with:
          path: C:/tdlib
          key: tdlib-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-tdlib.sh') }}

      - name: Build TDLib (cache miss)
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        run: bash scripts/install-tdlib.sh

      - name: Export CGO env
        run: |
          {
            echo "CGO_ENABLED=1"
            # TDJSON_STATIC_DEFINE：CMake 生成的导出头在 Windows 消费侧默认
            # __declspec(dllimport)，静态库没有 __imp_* 符号会链接失败；置位后走空宏。
            echo "CGO_CFLAGS=-I$TDLIB_PREFIX/include -DTDJSON_STATIC_DEFINE"
            echo "CGO_LDFLAGS=-L$TDLIB_PREFIX/lib $(bash scripts/tdlib-libs.sh --print)"
          } >> "$GITHUB_ENV"

      - name: Run tests
        run: go test ./...

      - name: Build application
        run: |
          go build -v -o tg-down.exe ./cmd
          ls -la tg-down.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: tg-down-windows
          path: tg-down.exe

  dependency-submission:
    runs-on: ubuntu-latest
    name: Submit Dependencies
    needs: test # 复用 test 任务已填充的 TDLib 缓存，避免重复构建
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup TDLib
        uses: ./.github/actions/setup-tdlib

      - name: Run Go Dependency Submission
        uses: actions/go-dependency-submission@v2
        with:
          go-mod-path: go.mod
          go-build-target: ./cmd
