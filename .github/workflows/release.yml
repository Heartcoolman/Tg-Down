name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  GO_VERSION: '1.25.12'

jobs:
  # CGo + TDLib 无法交叉编译，故按平台原生构建（仅 linux-amd64 与 darwin-arm64）。
  # Linux 在 debian:11 容器内构建以钉定 glibc 2.31 基线（修 #32：老系统跑不起新 runner 产物），
  # 发布包自带 lib/（OpenSSL 1.1），rpath=$ORIGIN/lib，开箱即用。
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            name: linux-amd64
            container: debian:11
          - runner: macos-14
            name: darwin-arm64
            container: ''
    steps:
      - name: Install build deps (debian:11 container)
        if: matrix.name == 'linux-amd64'
        # bullseye 的 gcc-10 编译新版 TDLib 会 ICE（段错误），改用 clang-11
        run: |
          apt-get update
          apt-get install -y build-essential clang cmake gperf git curl ca-certificates zlib1g-dev libssl-dev
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        run: cd web && npm ci --no-audit --no-fund && npm run build

      - name: Setup TDLib
        uses: ./.github/actions/setup-tdlib

      - name: Test
        run: go test ./...

      - name: Build (linux, self-contained rpath)
        if: matrix.name == 'linux-amd64'
        run: |
          mkdir -p dist/pkg/lib
          # 覆盖 setup-tdlib 导出的 rpath：发布包在用户机器上从 $ORIGIN/lib 找动态依赖
          export CGO_LDFLAGS="-L$HOME/.tdlib/lib -Wl,-rpath,\$ORIGIN/lib $(bash scripts/tdlib-libs.sh --print)"
          # -buildvcs=false：容器内 git 目录属主不匹配会使 VCS stamping 失败，版本号已由 ldflags 注入
          go build -buildvcs=false -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/pkg/tg-down ./cmd
          # 捆绑 OpenSSL 1.1：debian:11 之后的发行版已不再提供该版本
          cp /usr/lib/x86_64-linux-gnu/libssl.so.1.1 /usr/lib/x86_64-linux-gnu/libcrypto.so.1.1 dist/pkg/lib/
          objdump -T dist/pkg/tg-down | grep -o 'GLIBC_2\.[0-9.]*' | sort -Vu | tail -1

      - name: Build (macOS)
        if: matrix.name == 'darwin-arm64'
        run: |
          mkdir -p dist/pkg
          go build -buildvcs=false -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/pkg/tg-down ./cmd

      - name: Assemble package
        run: |
          install -m 600 config.yaml.example dist/pkg/config.yaml
          cp .env.example dist/pkg/.env.example || true
          cp LICENSE dist/pkg/ || true
          cp README.md dist/pkg/ || true
          cat > dist/pkg/start.sh <<'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          [ -d lib ] && export LD_LIBRARY_PATH="$(pwd)/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          mkdir -p downloads sessions
          chmod +x tg-down
          ./tg-down "$@"
          EOF
          chmod +x dist/pkg/start.sh dist/pkg/tg-down
          tar -czf "tg-down-${{ matrix.name }}.tar.gz" -C dist/pkg .

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: tg-down-${{ matrix.name }}
          path: tg-down-${{ matrix.name }}.tar.gz

  # Windows 单列一个作业：它整条链路都在 MSYS2 shell 里，塞进上面的 matrix 会把
  # 容器/apt 那几步的 shell 语义搅乱。产物是 .zip + .bat（tar.gz + start.sh 在 Windows 上没意义）。
  build-windows:
    name: Build windows-amd64
    runs-on: windows-latest
    env:
      TDLIB_PREFIX: C:/tdlib
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up MSYS2 (MinGW-w64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: false
          install: git make
          pacboy: >-
            toolchain:p
            cmake:p
            gperf:p
            openssl:p
            zlib:p

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        shell: pwsh
        run: cd web; npm ci --no-audit --no-fund; npm run build

      - name: Cache TDLib
        id: tdlib-cache
        uses: actions/cache@v4
        with:
          path: C:/tdlib
          key: tdlib-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-tdlib.sh') }}

      - name: Build TDLib (cache miss)
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        run: bash scripts/install-tdlib.sh

      - name: Export CGO env
        run: |
          {
            echo "CGO_ENABLED=1"
            # TDJSON_STATIC_DEFINE：CMake 生成的导出头在 Windows 消费侧默认
            # __declspec(dllimport)，静态库没有 __imp_* 符号会链接失败；置位后走空宏。
            echo "CGO_CFLAGS=-I$TDLIB_PREFIX/include -DTDJSON_STATIC_DEFINE"
            echo "CGO_LDFLAGS=-L$TDLIB_PREFIX/lib $(bash scripts/tdlib-libs.sh --print)"
          } >> "$GITHUB_ENV"

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          mkdir -p dist/pkg
          LDFLAGS="-s -w -X main.version=${GITHUB_REF_NAME}"
          # 优先全静态：MinGW 默认链 libssl.dll.a/libstdc++-6.dll，动态产物离开 MSYS2 就跑不起来。
          # 静态链接一旦失败也不让发布挂掉——退回动态，再把残留的 mingw64 DLL 捆进包里。
          if ! go build -buildvcs=false -ldflags "$LDFLAGS -extldflags '-static'" -o dist/pkg/tg-down.exe ./cmd; then
            echo ">>> 静态链接失败，回退动态链接 + 捆绑 DLL"
            go build -buildvcs=false -ldflags "$LDFLAGS" -o dist/pkg/tg-down.exe ./cmd
          fi
          # 静态成功时这里一个文件都不会拷
          ldd dist/pkg/tg-down.exe | awk '/mingw64/ {print $3}' | while read -r dll; do
            cp -n "$dll" dist/pkg/
          done
          echo ">>> 剩余动态依赖："
          ldd dist/pkg/tg-down.exe

      - name: Assemble package
        run: |
          cp config.yaml.example dist/pkg/config.yaml
          cp .env.example dist/pkg/.env.example || true
          cp LICENSE dist/pkg/ || true
          cp README.md dist/pkg/ || true
          # cmd.exe 要 CRLF，printf 显式写死，别指望 heredoc 的行尾
          printf '@echo off\r\ncd /d "%%~dp0"\r\nif not exist downloads mkdir downloads\r\nif not exist sessions mkdir sessions\r\ntg-down.exe %%*\r\n' > dist/pkg/start.bat

      - name: Zip package
        shell: pwsh
        run: Compress-Archive -Path dist/pkg/* -DestinationPath tg-down-windows-amd64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: tg-down-windows-amd64
          path: tg-down-windows-amd64.zip

  # 桌面客户端（Wails 壳，内嵌引擎）。与服务器版同源构建，但产物为安装包/便携包。
  # Linux 桌面用 ubuntu-24.04 + webkit2gtk-4.1（wails 的 webkit2_41 标签），
  # glibc 基线比服务器版高（Ubuntu 22.04+/Debian 12+），在发布说明中已注明。
  build-desktop-linux:
    name: Desktop linux-amd64
    runs-on: ubuntu-24.04
    steps:
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config zlib1g-dev libssl-dev

      - name: Install nfpm
        run: |
          curl -sSfL https://github.com/goreleaser/nfpm/releases/download/v2.41.1/nfpm_2.41.1_Linux_x86_64.tar.gz | tar -xz -C /tmp nfpm
          sudo install -m 755 /tmp/nfpm /usr/local/bin/nfpm

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Setup TDLib
        uses: ./.github/actions/setup-tdlib

      - name: Build desktop package
        run: |
          # CGO_CFLAGS/CGO_LDFLAGS 由 setup-tdlib 统一导出（含 TDLib 与 OpenSSL 路径），勿覆盖
          go build -tags "desktop,production,webkit2_41" -buildvcs=false \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/desktop/tg-down-desktop ./cmd/desktop
          bash scripts/package-desktop.sh linux amd64 "${GITHUB_REF_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: tg-down-desktop-linux-amd64
          path: |
            dist/desktop/tg-down-desktop-linux-amd64.deb
            dist/desktop/tg-down-desktop-linux-amd64.rpm
            dist/desktop/tg-down-desktop-linux-amd64.tar.gz

  build-desktop-macos:
    name: Desktop darwin-arm64
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Setup TDLib
        uses: ./.github/actions/setup-tdlib

      - name: Build desktop package
        run: |
          # 在 setup-tdlib 导出的 CGO_LDFLAGS（含 Homebrew OpenSSL 路径）上追加框架，勿整体覆盖
          export CGO_LDFLAGS="$CGO_LDFLAGS -framework UniformTypeIdentifiers"
          go build -tags "desktop,production" -buildvcs=false \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/desktop/tg-down-desktop ./cmd/desktop
          bash scripts/package-desktop.sh darwin arm64 "${GITHUB_REF_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: tg-down-desktop-darwin-arm64
          path: dist/desktop/tg-down-desktop-darwin-arm64.dmg

  build-desktop-windows:
    name: Desktop windows-amd64
    runs-on: windows-latest
    env:
      TDLIB_PREFIX: C:/tdlib
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up MSYS2 (MinGW-w64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: false
          install: git make zip
          pacboy: >-
            toolchain:p
            cmake:p
            gperf:p
            openssl:p
            zlib:p

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Cache TDLib
        id: tdlib-cache
        uses: actions/cache@v4
        with:
          path: C:/tdlib
          key: tdlib-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-tdlib.sh') }}

      - name: Build TDLib (cache miss)
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        run: bash scripts/install-tdlib.sh

      - name: Export CGO env
        run: |
          {
            echo "CGO_ENABLED=1"
            echo "CGO_CFLAGS=-I$TDLIB_PREFIX/include -DTDJSON_STATIC_DEFINE"
            echo "CGO_LDFLAGS=-L$TDLIB_PREFIX/lib $(bash scripts/tdlib-libs.sh --print)"
          } >> "$GITHUB_ENV"

      - name: Build desktop package
        shell: msys2 {0}
        run: |
          go build -tags "desktop,production" -buildvcs=false \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/desktop/tg-down-desktop.exe ./cmd/desktop
          bash scripts/package-desktop.sh windows amd64 "${GITHUB_REF_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: tg-down-desktop-windows-amd64
          path: |
            dist/desktop/tg-down-desktop-windows-amd64.zip
            dist/desktop/tg-down-desktop-windows-amd64-setup.exe

  release:
    name: Create Release
    needs: [build, build-windows, build-desktop-linux, build-desktop-macos, build-desktop-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          # 别写死 .tar.gz：Windows 发布包是 .zip
          sha256sum tg-down-* > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/tg-down-*.tar.gz
            artifacts/tg-down-*.zip
            artifacts/tg-down-desktop-*.deb
            artifacts/tg-down-desktop-*.rpm
            artifacts/tg-down-desktop-*.dmg
            artifacts/tg-down-desktop-*-setup.exe
            artifacts/checksums.txt
          generate_release_notes: true
          draft: false
          # 含 '-' 的 tag（如 v2.0.0-rc1）自动标记为预发布
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## 📦 发布包（官方 TDLib 引擎）

            - **Linux x86_64**: `tg-down-linux-amd64.tar.gz`——在 debian:11 构建（glibc ≥ 2.31 即可运行，
              覆盖 Debian 11+/Ubuntu 20.04+），OpenSSL 1.1 已随包捆绑于 `lib/`，开箱即用
            - **macOS Apple Silicon**: `tg-down-darwin-arm64.tar.gz`——需 `brew install openssl@3`
            - **Windows x86_64**: `tg-down-windows-amd64.zip`——MinGW-w64 构建，解压即用
            - **Docker（推荐，含 arm64）**: `docker pull ghcr.io/heartcoolman/tg-down:latest`，
              飞牛 fnOS 等 NAS 部署见 README「飞牛OS (fnOS) 部署」

            ## 🖥 桌面客户端

            - **macOS (Apple Silicon)**: `tg-down-desktop-darwin-arm64.dmg`——未签名，
              首次打开需右键 → 打开绕过 Gatekeeper
            - **Windows x86_64**: 便携 zip 或 `-setup.exe` 安装包（内置 WebView2 引导）
            - **Linux x86_64**: deb / rpm——依赖 webkit2gtk-4.1，Ubuntu 22.04+/Debian 12+；
              另有便携 tar.gz

            > 桌面客户端内嵌完整下载引擎；Docker 用户可继续使用网页端，
            > 桌面端「实例…」可添加远程 Docker 实例统一管理。

            > TDLib 已静态链入二进制。其余平台/架构因 CGo 无法交叉编译，
            > 可在对应平台自行 `make tdlib && make build` 构建。

            ### 🚀 使用
            1. 解压，编辑 `config.yaml` 填入 Telegram API 信息（https://my.telegram.org/apps）
            2. 运行 `./start.sh`（Windows：双击 `start.bat`）；`./tg-down --web` 启动网页管理端

  dependency-submission:
    runs-on: ubuntu-latest
    name: Submit Dependencies for Release
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup TDLib
        uses: ./.github/actions/setup-tdlib

      - name: Run Go Dependency Submission
        uses: actions/go-dependency-submission@v2
        with:
          go-mod-path: go.mod
          go-build-target: ./cmd
