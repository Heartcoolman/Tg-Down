version: "2"
run:
  issues-exit-code: 1
  tests: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  enable:
    - bodyclose
    - depguard
    - dogsled
    - dupl
    - exhaustive
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - lll
    - misspell
    - mnd
    - nakedret
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - whitespace
  settings:
    depguard:
      rules:
        main:
          files:
            - '!**/*_test.go'
          allow:
            - $gostd
            - github.com/zelenin/go-tdlib/client
            - github.com/joho/godotenv
            - gopkg.in/yaml.v3
            - modernc.org/sqlite
            - golang.org/x/term
            - golang.org/x/sys/windows/registry
            # v3.1 桌面客户端依赖：Wails 壳、托盘、系统通知
            - github.com/wailsapp/wails/v2
            - github.com/energye/systray
            - github.com/gen2brain/beeep
            - tg-down/internal/config
            - tg-down/internal/logger
            - tg-down/internal/telegram
            - tg-down/internal/downloader
            - tg-down/internal/media
            - tg-down/internal/web
            - tg-down/internal/retry
            - tg-down/internal/store
            - tg-down/internal/queue
            - tg-down/internal/notify
            - tg-down/internal/tgapi
            - tg-down/internal/desktop
    dupl:
      threshold: 100
    goconst:
      min-len: 2
      min-occurrences: 2
      # 测试文件已在 exclusions.paths 中排除报告，若仍计入出现次数，会让"被测值在测试里
      # 各写一次"误报为重复字面量。计数口径与报告口径保持一致。
      ignore-tests: true
    gocritic:
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
        - wrapperFunc
        - exitAfterDefer
        - importShadow
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 15
    lll:
      line-length: 140
    misspell:
      locale: US
    mnd:
      checks:
        - argument
        - case
        - condition
        - return
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "3"
        - "10"
        - "100"
        - "1000"
        - "1024"
        # 文件/目录权限位：写成八进制字面量比命名常量更易读，且 gosec 已单独把关取值范围
        - "0o600"
        - "0o750"
      ignored-functions:
        - time.Sleep
        - time.Duration
        - make
        - strconv.FormatInt
        - strconv.ParseInt
  exclusions:
    generated: lax
    rules:
      - linters:
          - dupl
          - goconst
          - mnd
        path: _test\.go
      - linters:
          - gochecknoinits
        path: cmd/
      # scripts/ 是构建期代码生成器，不进发布产物：图形坐标与 ICO 头字段是设计稿常量，
      # 命名后反而更难核对；路径全部来自本机命令行 flag，不存在外部输入。
      - linters:
          - gosec
          - mnd
        path: ^scripts/
      - linters:
          - unparam
        text: parameter .* seems to be unused
    paths:
      - .*\.pb\.go$
      - .*_test.go
      - vendor
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - tg-down
  exclusions:
    generated: lax
    paths:
      - .*\.pb\.go$
      - .*_test.go
      - vendor
      - third_party$
      - builtin$
      - examples$
